<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="HomeLink">
  <defs>
    <linearGradient id="hl-g" x1="8" y1="8" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="hl-bg" x1="0" y1="0" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#121a36"/>
      <stop offset="1" stop-color="#070b1a"/>
    </linearGradient>
    <radialGradient id="hl-halo" cx="60" cy="80" r="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="hl-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="hl-clip"><rect x="6" y="6" width="108" height="108" rx="30"/></clipPath>
  </defs>
  <style>
    .roof{stroke-dasharray:140;stroke-dashoffset:140;animation:draw 1.2s cubic-bezier(.65,0,.35,1) .1s forwards}
    .walls{stroke-dasharray:150;stroke-dashoffset:150;animation:draw 1.1s cubic-bezier(.65,0,.35,1) .7s forwards}
    .arc{opacity:0;animation:wave 2.6s ease-in-out 1.6s infinite}
    .arc.a2{animation-delay:1.85s}
    .node{transform-box:fill-box;transform-origin:center;opacity:0;animation:pop .5s cubic-bezier(.34,1.56,.64,1) forwards}
    .n1{animation-delay:.2s}.n2{animation-delay:.5s}.n3{animation-delay:.8s}.n4{animation-delay:1.4s}
    .halo{transform-box:fill-box;transform-origin:center;animation:breathe 4s ease-in-out infinite}
    .sheen{animation:sheen 5s ease-in-out 2s infinite}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
    @keyframes wave{0%,100%{opacity:.15}35%{opacity:1}}
    @keyframes breathe{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
    @keyframes sheen{0%{transform:translateX(-140px)}60%,100%{transform:translateX(140px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}}
  </style>
  <rect x="6" y="6" width="108" height="108" rx="30" fill="url(#hl-bg)"/>
  <g clip-path="url(#hl-clip)">
    <circle class="halo" cx="60" cy="80" r="52" fill="url(#hl-halo)"/>
    <g class="sheen"><path d="M-20 0h22L-8 120h-22z" fill="#fff" opacity=".05" transform="translate(40 0)"/></g>
  </g>
  <rect x="6.75" y="6.75" width="106.5" height="106.5" rx="29.25" fill="none" stroke="url(#hl-g)" stroke-width="1.5" opacity=".7"/>
  <g fill="none" stroke="url(#hl-g)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#hl-glow)">
    <path class="roof" d="M28 60 L60 32 L92 60"/>
    <path class="walls" d="M39 57 V86 Q39 91 44 91 H76 Q81 91 81 86 V57"/>
  </g>
  <g fill="none" stroke="#67e8f9" stroke-width="3.2" stroke-linecap="round">
    <path class="arc a2" d="M47.3 67.3 A18 18 0 0 1 72.7 67.3"/>
    <path class="arc" d="M53.6 73.6 A9 9 0 0 1 66.4 73.6"/>
  </g>
  <g filter="url(#hl-glow)">
    <circle class="node n1" cx="28" cy="60" r="4.2" fill="#22d3ee"/>
    <circle class="node n2" cx="60" cy="32" r="5.2" fill="#fff"/>
    <circle class="node n3" cx="92" cy="60" r="4.2" fill="#a855f7"/>
    <circle class="node n4" cx="60" cy="80" r="3.6" fill="#67e8f9"/>
  </g>
  <circle r="2.6" fill="#fff" filter="url(#hl-glow)">
    <animateMotion dur="3.2s" begin="2s" repeatCount="indefinite" path="M28 60 L60 32 L92 60" keyPoints="0;1;0" keyTimes="0;.5;1" calcMode="linear"/>
  </circle>
</svg>
