<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeLink &ndash; Inloggen</title>
    <link rel="stylesheet" href="style/base.css">
    <script>(function(){var theme=localStorage.getItem('theme')||'dark';var href=(theme==='dark'?'style/style-dark.css':'style/style.css');var l=document.createElement('link');l.rel='stylesheet';l.id='theme-stylesheet';l.href=href;document.head.appendChild(l);})();</script>
    <script src="script/homelink-boot.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style/homelink.css">
</head>
<body>
    <div class="hl-auth">
        <section class="hl-auth-stage" aria-hidden="true">
            <span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span>
            <div class="hl-auth-logo">
                <img src="img/brand/favicon.svg" alt="">
                <div class="hl-brand-text">
                    <span class="hl-wordmark">Home<b>Link</b></span>
                    <span class="hl-tagline">Smart home &middot; Network &middot; NAS</span>
                </div>
            </div>
            <div class="hl-auth-hero">
                <img class="mark" src="img/brand/homelink-mark.svg" alt="HomeLink">
                <h2>Je hele woning.<br><span>E&eacute;n verbonden platform.</span></h2>
                <p>Beheer Starlink, Proximus en Tailscale, je NAS, slimme apparaten en beveiliging vanaf &eacute;&eacute;n modern dashboard.</p>
            </div>
            <div class="hl-auth-feats">
                <span class="hl-pill"><i class="fas fa-satellite-dish"></i> Starlink 192.168.10.0/24</span>
                <span class="hl-pill"><i class="fas fa-network-wired"></i> Proximus 192.168.0.0/24</span>
                <span class="hl-pill"><i class="fas fa-shield-halved"></i> Tailscale</span>
            </div>
        </section>

        <section class="hl-auth-panel">
            <div class="auth-container">
                <div class="glass-card auth-card">
                    <header>
                        <h1 data-i18n="welcome_back">Welcome back</h1>
                        <p style="color: var(--text-muted); margin-bottom: 20px;">Log in om HomeLink te beheren</p>
                    </header>

                    <form action="index.html" method="post" class="auth-form">
                        <div>
                            <label for="username" data-i18n="username">Username</label>
                            <input type="text" id="username" name="username" required placeholder="Enter your username" data-i18n="enter_username" autocomplete="username">
                        </div>
                        <div>
                            <label for="password" data-i18n="password">Password</label>
                            <input type="password" id="password" name="password" required placeholder="Enter your password" data-i18n="enter_password" autocomplete="current-password">
                        </div>

                        <div class="auth-actions">
                            <button type="submit" id="btnLogin">
                                <i class="fas fa-sign-in-alt"></i> <span data-i18n="login">Login</span>
                            </button>
                            <button type="button" id="btnCreateAccount" class="buttonLogin">
                                <i class="fas fa-user-plus"></i> <span data-i18n="create_account">Create Account</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </div>

    <script src="script/i18n.js"></script>
    <script src="script/script.js"></script>
</body>
</html>
